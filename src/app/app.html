<app-toast />
<app-confirm-dialog />

@if (loading.isLoading()) {
  <div class="loading-overlay position-fixed top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center bg-dark bg-opacity-50">
    <div class="spinner-border text-light" role="status" style="width: 3rem; height: 3rem">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
}

<main class="w-100 min-vh-100 overflow-x-hidden overflow-y-auto">
  <router-outlet />
</main>
