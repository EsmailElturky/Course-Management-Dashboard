@if (confirmationService.request(); as req) {
  <div class="modal fade show d-block" tabindex="-1" role="dialog" aria-modal="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">{{ req.header }}</h5>
          <button
            type="button"
            class="btn-close"
            aria-label="Close"
            (click)="onReject()"
          ></button>
        </div>
        <div class="modal-body">
          <p class="mb-0">{{ req.message }}</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" (click)="onReject()">
            {{ req.rejectLabel }}
          </button>
          <button type="button" class="btn btn-danger" (click)="onAccept()">
            {{ req.acceptLabel }}
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-backdrop fade show"></div>
}
